function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);

const Phi=x=>0.5*(1+erf(x/Math.SQRT2));
const WP=m=>Phi(m/SIGMA);

// ---------- ranking ----------
function rank(sc){
  const hl=halfLife(sc.mode);
  return sc.items.map(it=>{
    const s=S[it.cls], u=U(it.lock);
    let P=0,C=0; const parts=[];
    it.members.forEach(m=>{
      const L=sc.leagues[m.lg]; const margin=(L.my??0)-(L.op??0);
      const p=it.fixedP!=null?it.fixedP/it.members.length:stakeP(m.d||0,margin);
      const ages=[L.age,...it.fresh.map(f=>f[2])];
      const cf=Math.pow(.5,Math.max(...ages)/hl);
      const c=(it.conf??1)*cf; P+=p; C+=c*p; parts.push({p,c,cf});});
    C=P?C/P:1; // P-weighted confidence
    const pr=s*P*C*u; // == sum of member priorities
    let band= (it.cls==='ZERO'&&it.lock<=3)||pr>=3 ? 'do' : pr>=1 ? 'before' : pr>=.25 ? 'week' : 'fyi';
    if(it.cls==='INFO') band='fyi';
    const stale=parts.some(x=>x.cf<.5);
    return {...it,S:s,P,C,U:u,pr,band,stale};
  }).sort((a,b)=>b.pr-a.pr||(a.lock??1e9)-(b.lock??1e9));
}

// ---------- render ----------
const BAND={do:['Do now','var(--bad)'],before:['Before lock','var(--warn)'],week:['This week','var(--info)'],fyi:['FYI','var(--dimmer)']};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ageTxt(m){return m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago';}
function card(it,sc,hero){
  const [bn,bc]=BAND[it.band];
  const mem=it.members.filter(m=>m.txt).map(m=>`<div class="mem" style="--c:${PCOL[m.lg]}"><span class="pb">${PNAME[m.lg]}</span>
    <span class="t">${esc(m.txt)}${m.d?` <span class="d">+${m.d.toFixed(1)}</span>`:''}</span>
    <a class="act" href="${m.url||LINKS[m.lg]}" target="_blank" rel="noopener">${m.url?'Open board':'Open '+PNAME[m.lg]} ↗</a></div>`).join('');
  const fr=[...it.fresh.map(f=>`${f[0]}: ${f[1]} ${ageTxt(f[2])}`),
    ...[...new Set(it.members.map(m=>m.lg))].map(k=>{const L=sc.leagues[k];return `roster: ${PNAME[k]} ${L.src} ${ageTxt(L.age)}`;})];
  const why=it.whyTpl.replace('{n}',it.members.length);
  const snooze=it.cls==='ZERO'?'<button>Snooze 1h</button>':'<button>My call</button>';
  return `<div class="card ${hero?'hero':''}" style="--bc:${bc}">
   <div class="band"><span>${hero?'Most important now · ':''}${bn}</span><span class="lock">${it.lockTxt||''}</span></div>
   <div class="hl">${esc(it.hl)}</div><p class="why">${esc(why)}</p>${mem}
   <div class="foot"><span class="${it.stale?'stale':''}">${it.stale?'Verify · ':''}${fr.join(' · ')}</span>
   ${it.band!=='fyi'?snooze:''}
   <details class="score"><summary>why ranked here</summary><code>S ${it.S} × P ${it.P.toFixed(1)} × C ${it.C.toFixed(2)} × U ${it.U} = ${it.pr.toFixed(2)}</code></details></div></div>`;
}
function render(key){
  const sc=SC[key];
  document.querySelectorAll('#clk button').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  document.getElementById('mode').textContent=sc.kicker;
  const items=rank(sc);
  const act=items.filter(i=>i.band!=='fyi');
  const heroOk=act.length&&(act[0].band==='do'||act[0].band==='before');
  document.getElementById('title').textContent=heroOk?`${act.filter(i=>i.band==='do'||i.band==='before').length} thing${act.filter(i=>i.band==='do'||i.band==='before').length>1?'s':''} to do before the next lock`:
    (sc.sys?'Check one league before lock':'You’re all set');
  document.getElementById('ribbon').innerHTML=`<span>Now <b>${sc.now}</b></span><span>Next lock <b>${sc.nextLock}</b></span><span>Next checkpoint <b>${sc.nextCheck}</b></span>`;
  // league strip
  const byLg={}; act.forEach(i=>i.members.forEach(m=>{byLg[m.lg]=(byLg[m.lg]||0)+1;}));
  document.getElementById('leagues').innerHTML=Object.entries(sc.leagues).map(([k,L])=>{
    const staleL=Math.pow(.5,L.age/halfLife(sc.mode))<.5;
    let st= staleL?['warn','Unverified']: byLg[k]?['bad',byLg[k]+' open']:['ok','Set ✓'];
    if(L.pre) st=L.done?['ok','Drafted']:['warn','Pre-draft'];
    const wp=L.pre?null:Math.round(WP(L.my-L.op)*100);
    return `<div class="lg" style="--c:${PCOL[k]}"><div class="plat">${PNAME[k]}</div>
     <div class="top"><span>${L.name}</span><span class="state ${st[0]}">${st[1]}</span></div>
     <div class="mu">${L.meta}${L.pre?'':`<br>${L.rec} · vs ${L.opp}<br>${L.live?'proj final':'proj'} ${L.my.toFixed(1)}–${L.op.toFixed(1)} · win ${wp}%`}</div>
     ${wp!=null?`<div class="wp"><i style="width:${wp}%"></i></div>`:''}</div>`;}).join('');
  // main
  let h='';
  (sc.sys||[]).forEach(s=>h+=`<div class="sys">${s.txt}</div>`);
  if(sc.recap) h+=`<div class="recap">${sc.recap}</div>`;
  if(heroOk){ h+=card(act[0],sc,true); }
  else { h+=`<div class="clear"><div class="band" style="--bc:var(--good)"><span>All clear</span></div>
     <div class="hl">${sc.sys?'Two leagues are set. One needs a fresh read.':'All 3 lineups are set.'}</div>
     <p class="why" style="margin:0">Next checkpoint: <b>${sc.nextCheck}</b>. Nothing on this page needs you before then.</p></div>`; }
  const rest=heroOk?act.slice(1):act;
  if(rest.length){ h+='<h2>Also this week</h2>'+rest.map(i=>card(i,sc,false)).join(''); }
  const fyi=items.filter(i=>i.band==='fyi');
  if(fyi.length) h+=`<details class="fyi" ${heroOk?'':'open'}><summary>FYI · ${fyi.length}</summary>${fyi.map(i=>card(i,sc,false)).join('')}</details>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('tl').innerHTML=sc.timeline.map(([w,t,c])=>`<li class="${c||''}"><span class="when">${w}</span><span>${esc(t)}</span></li>`).join('');
  try{localStorage.setItem('dash-proto-k',key);}catch(e){}
}
document.getElementById('clk').innerHTML=Object.entries(SC).map(([k,v])=>`<button data-k="${k}">${v.label}</button>`).join('');
document.getElementById('clk').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)render(k);});
let start='fri'; try{const s=localStorage.getItem('dash-proto-k'); if(s&&SC[s]) start=s;}catch(e){}
render(start);
</script>
</body></html>
